
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img">
  <title>ESPDeck</title>
  <desc>ESP32 learning lab logo featuring a microcontroller board, circuit traces, and a coding symbol.</desc>

  <rect width="1000" height="1000" fill="#101c2c"/>

  <!-- Circuit trace accents -->
  <g fill="none" stroke="#36e0b0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity=".75">
    <path d="M145 315H225V385H280"/>
    <path d="M855 315H775V385H720"/>
    <path d="M145 685H225V615H280"/>
    <path d="M855 685H775V615H720"/>
  </g>
  <g fill="#36e0b0">
    <circle cx="145" cy="315" r="16"/>
    <circle cx="855" cy="315" r="16"/>
    <circle cx="145" cy="685" r="16"/>
    <circle cx="855" cy="685" r="16"/>
  </g>

  <!-- Main circuit board -->
  <rect x="250" y="205" width="500" height="590" rx="54" fill="#173f42" stroke="#36e0b0" stroke-width="12"/>

  <!-- Mounting holes -->
  <g fill="#101c2c" stroke="#78f0cd" stroke-width="9">
    <circle cx="292" cy="247" r="17"/>
    <circle cx="708" cy="247" r="17"/>
    <circle cx="292" cy="753" r="17"/>
    <circle cx="708" cy="753" r="17"/>
  </g>

  <!-- USB connector -->
  <rect x="425" y="165" width="150" height="100" rx="20" fill="#c6d5df" stroke="#eef5f8" stroke-width="8"/>
  <rect x="454" y="184" width="92" height="45" rx="8" fill="#101c2c"/>
  <path d="M475 202H525" stroke="#36e0b0" stroke-width="7" stroke-linecap="round"/>

  <!-- ESP32 module -->
  <rect x="345" y="310" width="310" height="225" rx="24" fill="#263b50" stroke="#8ba4b9" stroke-width="8"/>

  <!-- Antenna pattern -->
  <g fill="none" stroke="#d6e4ec" stroke-width="9" stroke-linecap="round">
    <path d="M440 340V370M460 340V370M480 340V370M500 340V370M520 340V370M540 340V370M560 340V370"/>
    <path d="M420 350H580"/>
  </g>

  <!-- Chip -->
  <rect x="405" y="390" width="190" height="105" rx="13" fill="#101c2c" stroke="#36e0b0" stroke-width="6"/>
  <g stroke="#36e0b0" stroke-width="5" stroke-linecap="round">
    <path d="M425 378V390M455 378V390M485 378V390M515 378V390M545 378V390M575 378V390"/>
    <path d="M425 495V507M455 495V507M485 495V507M515 495V507M545 495V507M575 495V507"/>
  </g>
  <text x="500" y="435" text-anchor="middle" fill="#f2f7fb" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">ESP32</text>
  <text x="500" y="469" text-anchor="middle" fill="#36e0b0" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="3">DEV BOARD</text>

  <!-- Board components -->
  <g>
    <rect x="300" y="565" width="90" height="76" rx="12" fill="#263b50" stroke="#8ba4b9" stroke-width="5"/>
    <rect x="322" y="583" width="46" height="40" rx="5" fill="#101c2c"/>
    <path d="M334 593V613M356 593V613" stroke="#36e0b0" stroke-width="5" stroke-linecap="round"/>

    <rect x="610" y="565" width="90" height="76" rx="12" fill="#263b50" stroke="#8ba4b9" stroke-width="5"/>
    <circle cx="655" cy="603" r="19" fill="#36e0b0"/>
    <circle cx="655" cy="603" r="8" fill="#101c2c"/>
  </g>

  <!-- BOOT / EN buttons -->
  <g>
    <rect x="410" y="565" width="72" height="42" rx="12" fill="#d7e3e9"/>
    <rect x="498" y="565" width="72" height="42" rx="12" fill="#d7e3e9"/>
    <text x="446" y="592" text-anchor="middle" fill="#172833" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">BOOT</text>
    <text x="534" y="592" text-anchor="middle" fill="#172833" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">EN</text>
  </g>

  <!-- GPIO pins -->
  <g fill="#d6e4ec">
    <rect x="277" y="420" width="18" height="22" rx="3"/>
    <rect x="277" y="454" width="18" height="22" rx="3"/>
    <rect x="277" y="488" width="18" height="22" rx="3"/>
    <rect x="277" y="522" width="18" height="22" rx="3"/>
    <rect x="705" y="420" width="18" height="22" rx="3"/>
    <rect x="705" y="454" width="18" height="22" rx="3"/>
    <rect x="705" y="488" width="18" height="22" rx="3"/>
    <rect x="705" y="522" width="18" height="22" rx="3"/>
  </g>

  <!-- Code brackets -->
  <g fill="none" stroke="#f2b84b" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
    <path d="M365 680L325 720L365 760"/>
    <path d="M635 680L675 720L635 760"/>
    <path d="M535 670L465 770"/>
  </g>

  <!-- Brand name -->
  <text x="500" y="885" text-anchor="middle" fill="#f2f7fb" font-family="Arial, Helvetica, sans-serif" font-size="91" font-weight="800" letter-spacing="5">ESP<tspan fill="#36e0b0">Deck</tspan></text>
  <text x="500" y="935" text-anchor="middle" fill="#9fb6c6" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" letter-spacing="6">LEARN · BUILD · EXPLORE</text>
</svg>
